name: image

# The smoke job builds the image with nix/dockerTools (no Docker daemon
# involved), verifies the manifest and container config with skopeo, and
# asserts version truthfulness against the exact binary extracted from the
# image layers. One leg per architecture, each building natively — no
# cross-compilation. The container job is the other half: a real `docker build`
# of the Dockerfile, a real `docker run` under the hardening the hosting gate
# requires, and a room joined in the running container by the harness's client
# engine. The publish-rehearsal job runs the publish path's own buildx steps —
# the multi-architecture build, the tag computation and the version assertions
# — with nothing pushed to GHCR; the publish job pushes, on release tags only.
# See packaging/README.md.
#
# The workflow runs on GitHub-hosted runners throughout — `ubuntu-24.04` for
# x86_64 and `ubuntu-24.04-arm` for arm64.
#
# A pull request runs all of it only when it changes something the image is
# built from or a script a job reads: a prose edit does not build an image.
# There is no `push: branches: [main]`, because the merge commit carries the
# content the pull request already proved — but a release tag does run it, and
# `publish` is gated on the ref being a release tag, checked against Cargo with
# `scripts/release-tags.sh` — not on the triggering event — so a pull request
# rehearses the same build and the same assertions and pushes nothing, and this
# workflow's own `workflow_dispatch` (no inputs below) still cannot publish
# unless the ref it is run against already is a matching tag. The button that
# creates that tag lives in `release.yml`: a `workflow_dispatch` there validates
# a version input against Cargo, refuses one that already has a tag, pushes the
# tag it creates, and asks the API to dispatch this workflow against it, because
# GitHub does not start a new run for an event produced with a workflow's own
# `GITHUB_TOKEN` — which is what that tag push is — except `workflow_dispatch`
# itself. That is why `publish` and `release` below check the ref and not
# `github.event_name == 'push'`: the two paths that can reach a `v*` tag ref are
# a hand push from a terminal and `release.yml`'s dispatch, and both name a
# commit whose own Cargo.toml the script re-checks against the tag. Adding an
# input to this file that could publish an arbitrary commit directly was the
# alternative, and it was rejected: there is no tag on such a commit for
# `scripts/release-tags.sh` to agree with Cargo, so such an input would either
# duplicate the tag gate or bypass it.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'packaging/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/image-*.sh'
      - 'scripts/container-smoke.sh'
      - 'scripts/release-tags.sh'
      - 'scripts/assert-image-version.sh'
      - 'scripts/assert-multiarch-layers.py'
      - 'scripts/registry.py'
      - 'scripts/image-digest.py'
      # Both smokes call these two, so a change to either is a change to the
      # image's own gate.
      - 'scripts/check-server-version.sh'
      - 'scripts/skopeo-policy.json'
      - '.github/workflows/image.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    # No inputs: a dispatch run builds and smokes only. Publish stays gated on
    # a tag push, so this event has deliberately nothing that could push.

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      # One leg's failure must never cancel the other's proof.
      fail-fast: false
      # Both legs run on every event: restricting the arm64 leg to tags would
      # give up the arm64 image on the event that reviews it.
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same preamble as the checks job in `ci.yml`: the preinstalled toolchains nothing
      # here uses, non-fatal and gated on the free space the runner actually has.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: smoke the image without publishing
        run: scripts/image-smoke.sh ${{ matrix.goarch }}

  container:
    # `docker build`, `docker run` and a room joined in the container, which is
    # what the job above cannot prove: it builds the image without a daemon and
    # never runs it. The runner is chosen for its daemon and its full egress —
    # GitHub-hosted `ubuntu-24.04` ships Docker and reaches the whole network.
    # No buildx and nothing pushed: one architecture, a plain local build of
    # the repository's own Dockerfile, and scripts/container-smoke.sh, which
    # runs the container hardened and asserts the page the image bakes.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This job is the heaviest three-store user in the repository: a Docker
      # build's own layers and target directory, and the dev shell whose cargo
      # builds the engine the smoke joins with. The same preamble as the jobs
      # above, and the same gate on the free space the runner actually has.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      # The Dockerfile needs no nix: its builder stage is Docker's own
      # cross-toolchain image and its page stage is node's. The dev shell is
      # here for the client engine.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: build the image, run it, and join a room in it
        run: scripts/container-smoke.sh

  publish-rehearsal:
    # The publish path with nothing published: the same multi-architecture
    # buildx build, the tag computation from the same script, and the same
    # `--version` and `/meta` assertions against the image that was built.
    # `smoke` cannot prove any of that — it builds with nix and never runs the
    # image — and `container` builds one architecture with no buildx, so
    # without this job the first proof the release path works would be the
    # release itself. `publish` waits on it for that reason.
    #
    # There is no GHCR credential here and no elevated permission: the image
    # goes to a `registry:2` container on the runner's own loopback. A manifest
    # list cannot be loaded into the Docker daemon, so a loopback registry is
    # what lets the assertions run against the image that was built instead of
    # against a second, differently built one. Nothing leaves the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The preinstalled toolchains nothing here uses, as in the jobs above, gated on the
      # free space the runner actually has.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      # The builder pushes to `localhost:5000`, which is insecure-registry
      # plaintext and, by default, the build container's own loopback: the host
      # network namespace is what makes it the runner's.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host

      - name: start a loopback registry
        run: docker run --detach --name rehearsal-registry --publish 5000:5000 registry:2

      - name: compute the release tags
        id: tags
        run: scripts/release-tags.sh >> "$GITHUB_OUTPUT"

      # The same build the publish job runs, including the moving `<version>`
      # and `latest` aliases, so a malformed tag name cannot reach a release.
      - name: build both architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            localhost:5000/selvage-protocol/selvaged:${{ steps.tags.outputs.name }}
            localhost:5000/selvage-protocol/selvaged:${{ steps.tags.outputs.version }}
            localhost:5000/selvage-protocol/selvaged:latest
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # A provenance/SBOM attestation turns the pushed reference into an
          # index that also carries a platform-less attestation manifest;
          # `docker create --platform` below has to resolve a single concrete
          # platform out of that index against a plain `registry:2`, and this
          # is a known source of platform-resolution failures for classic
          # (non-buildx) pulls. The assertions here read the built binary and
          # the raw manifests directly, so the attestations add a real failure
          # mode for no verification value in return.
          provenance: false
          sbom: false

      - name: assert the built version on both architectures
        run: |
          scripts/assert-image-version.sh \
            "localhost:5000/selvage-protocol/selvaged:${{ steps.tags.outputs.name }}" \
            "${{ steps.tags.outputs.version }}"

      # A version string baked at compile time reads the same regardless of
      # which architecture compiled it, so the assertion above cannot tell a
      # genuinely cross-compiled arm64 leg from a republished amd64 one. This
      # reads the two platform manifests straight from the registry and
      # checks their layer digests differ, then checks the extracted binary's
      # own ELF header against the platform it is published under.
      - name: assert the two platforms are genuinely different builds
        run: |
          scripts/assert-multiarch-layers.py \
            "localhost:5000/selvage-protocol/selvaged:${{ steps.tags.outputs.name }}"

  publish:
    needs: [smoke, publish-rehearsal]
    # Release tags only. `publish-rehearsal` above has just run this job's
    # buildx steps on this same commit without pushing anywhere, so a tag is
    # not permission to assume the release path works — it is the one run where
    # the image is redistributed, which the owner accepted for FSL-1.1-MIT on
    # 2026-09-19 (see packaging/README.md). The gate is the ref, not the event:
    # a pull request's ref is never a tag, and this workflow's own
    # `workflow_dispatch` reaches here only when it is run against a ref that
    # already is one — which `release.yml` is the one path that creates.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The preinstalled toolchains nothing here uses, as in the jobs above, gated on the
      # free space the runner actually has.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release tag that triggered this job must name the Cargo version,
      # because the registry tags derive from Cargo — the check lives in the
      # script so the rehearsal computes them the same way.
      - name: compute the release tags
        id: tags
        run: scripts/release-tags.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/selvage-protocol/selvaged:${{ steps.tags.outputs.name }}
            ghcr.io/selvage-protocol/selvaged:${{ steps.tags.outputs.version }}
            ghcr.io/selvage-protocol/selvaged:latest
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # Same reason as the rehearsal's: the published-version assertion
          # below resolves a concrete platform out of the pushed index with
          # classic (non-buildx) `docker create --platform`, and attestation
          # manifests are a known source of failures for that.
          provenance: false
          sbom: false

      # The pushed image must report the version it is tagged with, on both
      # architectures — the read-back the rehearsal asserted locally.
      - name: assert the published version
        run: |
          scripts/assert-image-version.sh \
            "ghcr.io/selvage-protocol/selvaged:${{ steps.tags.outputs.name }}" \
            "${{ steps.tags.outputs.version }}"

      # Same proof as the rehearsal's, against what is now actually on GHCR:
      # the manifests differ and each platform's binary is its own ELF.
      - name: assert the two published platforms are genuinely different builds
        run: |
          scripts/assert-multiarch-layers.py \
            "ghcr.io/selvage-protocol/selvaged:${{ steps.tags.outputs.name }}"

  release:
    # The GitHub Release for the tag. Publishing the image is what makes a
    # release worth creating, but a tag alone leaves no release behind — the org
    # holds bare tags and zero releases — so this job creates it once `publish`
    # has pushed and re-asserted the image. Same gate as `publish`: the ref
    # names an existing, Cargo-agreeing tag, never a pull request's branch.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Does nothing when the release already exists (a re-run), and refuses a
      # tag whose name is not the Cargo version — the same rule `release-tags.sh`
      # enforces for the image.
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
