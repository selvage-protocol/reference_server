name: image

# The smoke job runs on every PR and on main without pushing anything: it
# builds the multi-arch image to a local OCI tarball, asserts the manifest
# list from the tarball's index, and loads and runs each architecture to
# check version truthfulness there. The publish job below pushes to GHCR, and only on
# release tags — no tag has been cut, so it has never run. See
# packaging/README.md (including the FSL-1.1-MIT redistribution review that
# must happen before any future publish).
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Conclusion-readable probe: CI logs are not reachable from automation,
  # so the runner's Docker state is reported through this job's conclusion.
  # Green daemon + red smoke = the failure is past the daemon (setup/build);
  # red daemon = the smoke needs the daemon-free nix/dockerTools fallback.
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: docker daemon probe
        run: |
          docker --version
          docker info
          docker buildx version

  smoke:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Same preamble as the checks job: the runner image guarantees only
      # ~14 GB free, and this job pulls builder images plus a registry.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      # The runners' Docker is unproven, so the smoke proves its toolchain
      # rather than assuming it: versions first, then the real build below.
      # `info` stays strict: without a reachable daemon nothing below can run,
      # and the step name says so.
      - name: docker toolchain
        run: |
          docker --version
          docker buildx version
          docker info
          docker buildx ls

      - uses: docker/setup-qemu-action@v3

      # Blacksmith's own builder setup, not the stock buildx action: these
      # runners document it as the path that owns the builder lifecycle.
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: selvaged-image

      - name: smoke the image without publishing
        run: scripts/image-smoke.sh

  publish:
    needs: [smoke]
    # Release tags only. No `v*` tag has ever been cut, and none is cut here:
    # pushing the image to GHCR is redistribution of the FSL-1.1-MIT binary,
    # which needs the redistribution review recorded in packaging/README.md
    # before any future publish.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tags
        id: tags
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          sha="$(git rev-parse --short HEAD)"
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "tag=ghcr.io/selvage-protocol/selvaged:$version-$sha"
          } >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.tag }}
            ghcr.io/selvage-protocol/selvaged:${{ steps.tags.outputs.version }}
            ghcr.io/selvage-protocol/selvaged:latest
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      # The pushed image must report the version it is tagged with, on both
      # architectures — the same truthfulness the smoke job asserts locally.
      - name: assert the published version
        run: |
          tag='${{ steps.tags.outputs.tag }}'
          version='${{ steps.tags.outputs.version }}'
          for arch in amd64 arm64; do
            out="$(docker run --rm --platform "linux/$arch" "$tag" --version)"
            if [ "$out" != "selvaged/$version" ]; then
              echo "$arch --version says '$out', want 'selvaged/$version'" >&2
              exit 1
            fi
          done
          port=18080
          docker run -d --name published-smoke -p "127.0.0.1:$port:8080" "$tag"
          trap 'docker rm -f published-smoke >/dev/null' EXIT
          scripts/check-server-version.sh "http://127.0.0.1:$port" "$version" "selvaged/$version"
