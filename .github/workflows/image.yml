name: image

# The smoke job runs on every PR and on main without pushing anything: it
# builds the image with nix/dockerTools (no Docker daemon involved), verifies
# the manifest and container config with skopeo, and asserts version
# truthfulness against the exact binary extracted from the image layers.
# One leg per architecture, each building natively — no cross-compilation.
# The publish job below pushes to GHCR, and only on release tags — no tag
# has been cut, so it has never run. See packaging/README.md (including the
# FSL-1.1-MIT redistribution review that must happen before any future
# publish).
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      # One leg's failure must never cancel the other's proof.
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Same preamble as the checks job: the runner image guarantees only
      # ~14 GB free, and a cold nix store has to fit a rust-overlay
      # toolchain plus crane's dependency artefacts.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: smoke the image without publishing
        run: scripts/image-smoke.sh ${{ matrix.goarch }}

  publish:
    needs: [smoke]
    # Release tags only. No `v*` tag has ever been cut, and none is cut here:
    # pushing the image to GHCR is redistribution of the FSL-1.1-MIT binary,
    # which needs the redistribution review recorded in packaging/README.md
    # before any future publish. Note the publish leg builds with Docker
    # while the smoke builds with nix: the runners that proved the smoke
    # cannot execute buildx builds, so this leg must itself be re-proven
    # (green on a real run) before any first publish — a tag cut is not
    # permission to assume it works.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tags
        id: tags
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          sha="$(git rev-parse --short HEAD)"
          # The registry tags derive from Cargo, so the release tag that
          # triggered this job must name the same version — otherwise a tag
          # cut from the wrong commit would publish a mismatched version.
          if [ "${GITHUB_REF_NAME:?}" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "tag=ghcr.io/selvage-protocol/selvaged:$version-$sha"
          } >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.tag }}
            ghcr.io/selvage-protocol/selvaged:${{ steps.tags.outputs.version }}
            ghcr.io/selvage-protocol/selvaged:latest
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      # The pushed image must report the version it is tagged with, on both
      # architectures — the same truthfulness the smoke job asserts locally.
      - name: assert the published version
        run: |
          tag='${{ steps.tags.outputs.tag }}'
          version='${{ steps.tags.outputs.version }}'
          for arch in amd64 arm64; do
            out="$(docker run --rm --platform "linux/$arch" "$tag" --version)"
            if [ "$out" != "selvaged/$version" ]; then
              echo "$arch --version says '$out', want 'selvaged/$version'" >&2
              exit 1
            fi
          done
          port=18080
          docker run -d --name published-smoke -p "127.0.0.1:$port:8080" "$tag"
          trap 'docker rm -f published-smoke >/dev/null' EXIT
          scripts/check-server-version.sh "http://127.0.0.1:$port" "$version" "selvaged/$version"
