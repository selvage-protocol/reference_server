name: ci

# No `push: branches: [main]`: a pull request already runs every step below, and
# the merge commit carries the same content, so the merge would buy the same
# minutes a second time. `workflow_dispatch` is the re-run for a commit that
# reached `main` without one, and the scheduled `nightly.yml` is the run that
# keeps the default branch's store cache warm for the branches that restore it.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.revisions.outputs.candidate }}
      checker: ${{ steps.revisions.outputs.checker }}
      specification: ${{ steps.revisions.outputs.specification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: reference_server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/specification
          ref: 12795c817566897d0af4c13877d229f4555581f8
          path: contract-checker
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/specification
          ref: main
          path: specification
          persist-credentials: false
      - name: record the contract revisions
        id: revisions
        run: |
          candidate=$(git -C reference_server rev-parse HEAD)
          checker=$(git -C contract-checker rev-parse HEAD)
          specification=$(git -C specification rev-parse HEAD)
          echo "candidate=$candidate" | tee -a "$GITHUB_OUTPUT"
          echo "checker=$checker" | tee -a "$GITHUB_OUTPUT"
          echo "specification=$specification" | tee -a "$GITHUB_OUTPUT"
      - name: public workspace contracts against the candidate
        run: >-
          python3 contract-checker/scripts/check-workspace.py --workspace .
          --consumer reference_server --revision reference_server=HEAD --revision specification=HEAD

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The lychee release the `links` step installs, and the one this repository's
      # dev shell carries, so the run here and `scripts/ci-local.sh links` agree.
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The preinstalled toolchains nothing here uses. Each removal is non-fatal, so an image
      # change cannot break the job, and the `df` in the step prints both sides of what it did.
      # No third-party action involved.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # `primary-key` is required: without it the action fails before any check runs.
      # No `purge`: it needs `actions: write`, and this workflow has `contents: read`.
      # No `gc-max-store-size`: the checks are built with --no-link, so a GC here would
      # collect the very store paths this cache exists to save.
      # The key names no architecture because only x86_64 jobs write it; the
      # prefix must, because it is what a changed `flake.lock` falls back to, and
      # `image.yml`'s arm leg saves under the same `${{ runner.os }}` prefix — a
      # loose prefix can otherwise restore gigabytes of arm64 store on an x86_64
      # runner that has 14 GB of disk.
      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: format
        run: nix build .#checks.x86_64-linux.fmt --no-link --print-build-logs

      - name: clippy
        run: nix build .#checks.x86_64-linux.clippy --no-link --print-build-logs

      # The corpus replay is part of this suite: the vendored `vectors/` directory reaches the
      # sandbox through `SELVAGE_VECTORS`, so no specification checkout is needed here.
      - name: tests
        run: nix build .#checks.x86_64-linux.nextest --no-link --print-build-logs

      # `packages.default` is what `nix run` hands back, and the `evaluate every check` step
      # below only evaluates it, so this step is what builds it.
      - name: the default package
        run: nix build .#default --no-link --print-build-logs

      # `crates/selvaged` is FSL-1.1-MIT; everything else is MIT OR Apache-2.0. Nothing else
      # in this workflow can see that rule break.
      - name: licences
        run: nix develop . -c cargo deny check licenses

      - name: evaluate every check
        run: nix flake check --no-build .


      # The command this repository's release workflow runs before it commits a
      # version (`scripts/bump-version.sh`): a bump word in, the next version on the
      # last line of stdout, and a refusal that writes nothing for a word, an
      # argument or a manifest it cannot compute from.
      - name: the version bump
        run: nix build .#checks.x86_64-linux.bump-version --no-link --print-build-logs


      # The guard around a workflow's `dry_run` input (`scripts/check_dry_run_gating.py`):
      # a plan step prints what a real run would do, and every step after it has to be
      # excluded from a dry run. Unknown actions, bad expressions and shell mistakes are the
      # step below; *which* steps carry no condition at all is not, and lints clean.
      - name: the release workflow's dry_run gating
        run: nix build .#checks.x86_64-linux.dry-run-gating --no-link --print-build-logs

      - name: release-only retries recheck remote tags before bumping
        run: nix build .#checks.x86_64-linux.release-retry --no-link --print-build-logs

      # Unknown actions, bad expressions and shell mistakes, caught before the run.
      - name: lint the workflows
        run: nix develop . -c actionlint

      # The same check the pre-commit hook runs: the hook cannot run outside the dev shell,
      # while a job sees every pull request.
      - name: typos
        run: nix develop . -c typos

      # The runner's own lychee, from the pinned release: `scripts/ci-local.sh links`
      # runs the same scope and the same arguments through the dev shell, which
      # carries this version. `$RUNNER_TEMP` is the runner's temp directory, not a
      # host's RAM-backed `/tmp`.
      - name: install lychee
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 "$RUNNER_TEMP/lychee" /usr/local/bin/lychee
          lychee --version

      # This repository's reader-facing front matter, `README.md` and `docs/`, not
      # every Markdown file a checkout holds. A relative link in either is resolved
      # against the file that carries it, so a moved paragraph's link is checked at
      # its new depth.
      - name: links over the README and the docs tree
        run: lychee --config lychee.toml --no-progress README.md docs
