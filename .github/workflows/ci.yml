name: ci

# No `push: branches: [main]`: a pull request already runs every step below, and
# the merge commit carries the same content, so the merge would buy the same
# minutes a second time. `workflow_dispatch` is the re-run for a commit that
# reached `main` without one, and the scheduled `nightly.yml` is the run that
# keeps the default branch's store cache warm for the branches that restore it.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The preinstalled toolchains nothing here uses. Each removal is non-fatal, so an image
      # change cannot break the job, and the `df` in the step prints both sides of what it did.
      # No third-party action involved.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # `primary-key` is required: without it the action fails before any check runs.
      # No `purge`: it needs `actions: write`, and this workflow has `contents: read`.
      # No `gc-max-store-size`: the checks are built with --no-link, so a GC here would
      # collect the very store paths this cache exists to save.
      # The key names no architecture because only x86_64 jobs write it; the
      # prefix must, because it is what a changed `flake.lock` falls back to, and
      # `image.yml`'s arm leg saves under the same `${{ runner.os }}` prefix — a
      # loose prefix can otherwise restore gigabytes of arm64 store on an x86_64
      # runner that has 14 GB of disk.
      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: format
        run: nix build .#checks.x86_64-linux.fmt --no-link --print-build-logs

      - name: clippy
        run: nix build .#checks.x86_64-linux.clippy --no-link --print-build-logs

      # The corpus replay is part of this suite: the vendored `vectors/` directory reaches the
      # sandbox through `SELVAGE_VECTORS`, so no specification checkout is needed here.
      - name: tests
        run: nix build .#checks.x86_64-linux.nextest --no-link --print-build-logs

      # `packages.default` is what `nix run` hands back. Nothing built it — the `evaluate every
      # check` step below only evaluates it — so it was free to break quietly, and did.
      - name: the default package
        run: nix build .#default --no-link --print-build-logs

      # `crates/selvaged` is FSL-1.1-MIT; everything else is MIT OR Apache-2.0. Nothing else
      # in this workflow can see that rule break.
      - name: licences
        run: nix develop . -c cargo deny check licenses

      - name: evaluate every check
        run: nix flake check --no-build .

      # The TLS front's idle logic (`packaging/pi-demo/tls-proxy.py`), the guards around
      # the two deploy scripts (`packaging/prod/deploy.py` and `packaging/pi/deploy.py`)
      # and the public demo's front under a real nginx
      # (`packaging/prod/test_front_limits.py`): the checks here that are not Cargo
      # targets. Stdlib Python and nginx, so the runner needs nothing but nix.
      - name: the TLS front's idle logic
        run: nix build .#checks.x86_64-linux.tls-proxy --no-link --print-build-logs

      - name: the public demo's deploy guard
        run: nix build .#checks.x86_64-linux.prod-deploy --no-link --print-build-logs

      - name: the Pi's deploy guard
        run: nix build .#checks.x86_64-linux.pi-deploy --no-link --print-build-logs

      # The public demo's front, under its real configuration and a real nginx: that a
      # source is refused, and that one metered endpoint cannot spend another's budget.
      # Both are about a running proxy, so neither is readable from the configuration.
      - name: the public demo's front limits
        run: nix build .#checks.x86_64-linux.prod-front --no-link --print-build-logs

      # Unknown actions, bad expressions and shell mistakes, caught before the run.
      - name: lint the workflows
        run: nix develop . -c actionlint

      # The same check the pre-commit hook runs: the hook cannot run outside the dev shell,
      # which is how a misspelling reached `main`, while a job sees every pull request.
      - name: typos
        run: nix develop . -c typos
