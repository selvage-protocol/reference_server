name: nightly

on:
  schedule:
    # 03:17 UTC daily: off the hour, so it does not collide with every other cron.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Copied from `ci.yml`: the runner image guarantees only ~14 GB free, and a cold
      # cache has to fit a rust-overlay toolchain plus crane's dependency artefacts.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # These three are the ones that were left behind when the monorepo was split, and
      # none of them has a home in `ci.yml`. The vectors are read from the checkout's
      # `vectors/`, so no `SELVAGE_VECTORS` is needed here (the sandbox check sets it).
      - name: coverage
        run: nix develop . -c cargo tarpaulin --fail-under 80

      - name: cargo-deny
        run: nix develop . -c cargo deny check

      - name: cargo-audit
        run: nix develop . -c cargo audit

  # See `ci.yml`: an issue is the only signal an Actions-blind session can read.
  report:
    needs: [nightly]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "ci: ${{ github.workflow }} is failing on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failing run: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Failing run: $RUN"
          fi

  clear:
    needs: [nightly]
    if: success()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "ci: ${{ github.workflow }} is failing on ${{ github.ref_name }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Green again: $RUN"
          fi
