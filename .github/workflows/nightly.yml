name: nightly

on:
  schedule:
    # 03:17 UTC daily: off the hour, so it does not collide with every other cron.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    # GitHub-hosted, unlike the jobs in `ci.yml`: this is a scheduled audit and
    # not a feedback path, so its minutes need not be bought, and the three
    # commands below reach the whole network — the advisory database and the
    # crates it compares against — where the Blacksmith runners have proved
    # github-scoped egress only.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Copied from `ci.yml`: the runner image guarantees only ~14 GB free, and a cold
      # cache has to fit a rust-overlay toolchain plus crane's dependency artefacts.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          # Architecture-qualified for the same reason as `ci.yml`'s: the
          # `${{ runner.os }}`-only prefix also matches the arm64 store
          # `image.yml`'s arm leg saves, which is useless on this runner.
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # These three are the ones that were left behind when the monorepo was split, and
      # none of them has a home in `ci.yml`. The vectors are read from the checkout's
      # `vectors/`, so no `SELVAGE_VECTORS` is needed here (the sandbox check sets it).
      - name: coverage
        run: nix develop . -c cargo tarpaulin --engine llvm --fail-under 80

      - name: cargo-deny
        run: nix develop . -c cargo deny check

      - name: cargo-audit
        run: nix develop . -c cargo audit
