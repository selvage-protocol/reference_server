name: nightly

on:
  schedule:
    # 03:17 UTC daily: off the hour, so it does not collide with every other cron.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    # GitHub-hosted `ubuntu-24.04`: this is a scheduled audit and not the
    # pull-request feedback path, and its three commands below reach the whole
    # network — the advisory database and the crates they compare against.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Copied from `ci.yml`: the preinstalled toolchains nothing here uses, non-fatal and
      # gated on the free space the runner actually has.
      - name: free disk space
        run: |
          df -h /
          # A cold Nix store — the rust-overlay toolchain plus crane's dependency
          # artefacts — needs on the order of 10-20 GB, and the runner the job lands on
          # has had 87 GB free, so this usually has nothing to do. It deletes only when
          # the free space is genuinely short, which keeps the insurance without paying
          # for it on every run.
          available_kb=$(df --output=avail -k / | tail -n 1)
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "skipping: $((available_kb / 1024 / 1024)) GB free is enough for a cold Nix store"
            exit 0
          fi
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet || true
          df -h /

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          # Architecture-qualified for the same reason as `ci.yml`'s: the
          # `${{ runner.os }}`-only prefix also matches the arm64 store
          # `image.yml`'s arm leg saves, which is useless on this runner.
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # These three are the ones that were left behind when the monorepo was split, and
      # none of them has a home in `ci.yml`. The vectors are read from the checkout's
      # `vectors/`, so no `SELVAGE_VECTORS` is needed here (the sandbox check sets it).
      - name: coverage
        run: nix develop . -c cargo tarpaulin --engine llvm --fail-under 80

      - name: cargo-deny
        run: nix develop . -c cargo deny check

      - name: cargo-audit
        run: nix develop . -c cargo audit
