name: deploy-prod

# The button that redeploys the public demo, `selvage-demo.dontblameme.dev`.
#
# One job, behind the `prod` environment, which is what makes this safe to have
# at all: the environment's required reviewer is the approval, and the
# environment's secrets are unreadable until that approval passes. So a change
# **CI initiates** reaches the box only through an approved run: between deploys
# a compromised workflow, a compromised third-party action or a stolen
# repository secret has no credential for the box.
#
# That approval gates CI-initiated changes only. The box's update timer follows
# the tags `/srv/selvage/.env` names, and while `.env` names `latest`, whatever
# is published to `latest` reaches production **unapproved, within one
# five-minute tick**, and a new `selvaged` ends every room. That means any `v*`
# release tag of this repository (`image.yml` keeps a prerelease off `latest`),
# any `v*` tag of `web_client`, prerelease included, since its image workflow
# still moves `latest` for one, and anything else holding `packages: write` on
# the organisation's GHCR, a compromised publish step or action included.
# Pinning a version in `.env` is what puts a service back behind this approval
# for releases. A version tag is mutable too, so a GHCR writer who overwrites
# the pinned tag is still followed; only a digest would close that, and the
# owner chose tags.
#
# How it reaches the box: `tailscale/github-action` joins the tailnet as an
# **ephemeral** node tagged `tag:ci`, using Tailscale workload identity
# federation — a client id and an audience, which Tailscale's own documentation
# says are not secrets, exchanged for a short-lived node together with a
# GitHub-signed OIDC token whose `sub` claim carries this job's environment. The
# tailnet's federated identity is constrained to exactly
# `repo:selvage-protocol@328844633/reference_server@1368869493:environment:prod` —
# the immutable form, with the owner's and the repository's numeric ids, because
# this organisation has ID-based OIDC subject claims enabled; the plain form is
# rejected with a 403 at the exchange. That is why the
# `environment:` line below matters: a job without it is still issued a token, but
# the claim names the ref rather than the environment, so that rule rejects the
# exchange. With the line, the approval gate and the credential's scope are the
# same condition and cannot drift apart.
#
# Then Tailscale SSH as `deployci`, a local user on the box with no password, no
# key and exactly one permitted root command — `/usr/local/sbin/selvage-deploy`,
# with no argument wildcard. Tailscale SSH cannot restrict the command (the
# policy's `ssh` rules have no `cmd` field), so the bound lives on the box and
# is proved there rather than claimed here.
#
# What a run may change, which is the whole of what CI can do to production:
# **which tag of two already-published images `/srv/selvage/.env` names**. The
# request carries one tag reference per image this dispatch names, the box
# rewrites those lines of `.env` and nothing else, and pulls and ups. The compose
# file is the owner's to edit by hand and a run never writes it, so a run cannot
# add a port, drop a capability, mount a certificate or raise a memory limit. An
# input this dispatch leaves empty means "leave that line exactly as it is". The
# box's update timer follows whatever tag `.env` names, so a dispatch is how a
# service is pinned to a version, moved back to `latest`, or moved at once.
#
# What a run cannot do to a live session: the page container is separate and the
# server's state is memory-only, so this is where that cost is written down —
# **replacing `selvaged` ends every room on the instance.** There is no
# drain and no room count; `/meta` is the only read besides `/session`. That is
# why a dispatch has a human on the approval and is deliberate rather than a tag
# push. A service `.env` leaves on `latest` pays that cost on every release with
# no approval at all (above).
#
# `workflow_dispatch` only: no `pull_request` and no `push` event can reach this
# file, so no branch can deploy itself. The deploy workflow that runs is the
# reviewed one on `main` (dispatch it with `--ref main`), and the *images* are
# chosen by the inputs.
#
# Every action is pinned by commit SHA with the version it is in a comment. A
# SHA behind a comment that claims a different version is worse than no pin, so
# each one below was read back from the action's repository when it was written.
#
# `ubuntu-24.04`: this job downloads a Tailscale tarball from
# `pkgs.tailscale.com`, reads `ghcr.io` and speaks to the tailnet. It also has to
# support Node.js 24, which `tailscale/github-action@v4.1.3` declares
# (`runs.using: node24`); the GitHub-hosted image does, and this repository
# already runs `actions/checkout@v7.0.1` — also `node24` — on `ubuntu-24.04`
# today.
on:
  workflow_dispatch:
    inputs:
      server_version:
        description: 'selvaged tag to deploy: a version (e.g. 0.4.6) or latest. Empty leaves it alone.'
        required: false
        default: ''
      web_version:
        description: 'selvage-web tag to deploy: a version (e.g. 0.4.6) or latest. Empty leaves it alone.'
        required: false
        default: ''

# Two deploys never interleave, and a queued one is not silently dropped: an
# approval gate in front of a run that another run cancels is a gate that lies.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    # `id-token: write` is what mints the OIDC token the Tailscale federated
    # identity exchange needs, and it is only obtainable because this job names
    # the environment above. Nothing here needs a write to the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The request is built and checked against the box's own grammar here,
      # before the tailnet is joined, so a malformed tag fails without touching
      # anything. It stays a tag: the box pulls it and its deploy log names the
      # digest the tag resolved to there, which is the record of what ran. An
      # input that is empty means "leave that line as it is" and is simply absent.
      - name: build the request
        env:
          SERVER_VERSION: ${{ inputs.server_version }}
          WEB_VERSION: ${{ inputs.web_version }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/deploy-request"
          : >"$request"
          if [ -n "$SERVER_VERSION" ]; then
            echo "SELVAGED_IMAGE=ghcr.io/selvage-protocol/selvaged:$SERVER_VERSION" >>"$request"
          fi
          if [ -n "$WEB_VERSION" ]; then
            echo "SELVAGE_WEB_IMAGE=ghcr.io/selvage-protocol/selvage-web:$WEB_VERSION" >>"$request"
          fi
          python3 -B - "$request" <<'EOF'
          import sys
          sys.path.insert(0, "deploy")
          import deploy
          try:
              deploy.parse_request(open(sys.argv[1], "rb").read())
          except deploy.Refused as refusal:
              sys.exit(f"refused: {refusal}")
          EOF
          cat "$request"

      # `ping` and the loop below are the plan's answer to the tailnet being
      # eventually consistent about a peer that came up seconds ago: verify
      # reachability, then poll the predicate with a deadline rather than sleep
      # and hope. The ephemeral node is logged out again in the action's post
      # step, so nothing is left joined between runs.
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: selvage-protocol-prod

      - name: wait for the box to answer as deployci
        run: |
          set -euo pipefail
          last=''
          deadline=$((SECONDS + 150))
          while :; do
            if last=$(ssh -o BatchMode=yes -o ConnectTimeout=10 \
                -o StrictHostKeyChecking=accept-new \
                deployci@selvage-protocol-prod true 2>&1); then
              echo "deployci@selvage-protocol-prod answers"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "deployci@selvage-protocol-prod did not answer within 150s; last: $last" >&2
              exit 1
            fi
            sleep 5
          done

      # The only privileged thing this job does, and it is one argument-free
      # command line: `deployci` may run nothing else as root. The request goes
      # in on stdin because the sudoers rule deliberately has no argument
      # wildcard, and the script refuses every value that is not a tag of one of
      # the two images.
      - name: deploy
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            deployci@selvage-protocol-prod \
            '/usr/bin/sudo /usr/local/sbin/selvage-deploy' \
            <"$RUNNER_TEMP/deploy-request"

      # A deploy that goes green because `docker compose` exited zero is a deploy
      # nobody checked, so this asserts what is actually serving: the origin, read
      # on the box through the front over the SSH path step 5 already opened —
      # `https://127.0.0.1/meta` and the page, both naming the demo's own `Host`,
      # because the front is the server for that name and closes the connection
      # for any other one — and the run fails unless it reports the version this
      # dispatch asked for. `/meta` reports the Cargo version, so a commit-stamped
      # tag (`0.4.6-97ff967`) is compared by its version and a prerelease
      # (`1.0.0-rc.1`) as it is. A tag that names no version (`latest`) has none
      # to compare, so `/meta` is read and not compared, as it is for a page-only
      # dispatch.
      #
      # The *public* URL is read in three shapes, and only one of them decides the
      # run. Cloudflare serves a managed challenge to a programmatic client on a
      # datacenter address — this runner, and the box itself — and an edge is not
      # something a deploy can fix, so a challenge, an unreadable read, and any
      # other answer that is not a version are reports: each says in plain words
      # what came back, a challenge ends the attempt at the first challenge
      # response instead of polling a deadline it cannot pass, and none of them
      # turns a healthy deploy red. A read that answers 200 reporting a version
      # *other* than the one this dispatch named is red — there the origin above is
      # right and the edge is serving something this deploy did not put behind it,
      # a stale cache or a route pointing elsewhere, which is what this step exists
      # to catch and what the origin read cannot see. A read reporting the version
      # deployed is green, so where the edge does let a client like this one through
      # the check comes back on its own.
      #
      # `scripts/verify_deploy.py` is both reads. Each read polls a real
      # predicate with its own 60 s deadline and reports what it last observed,
      # so a step that cannot pass says so in about a minute instead of looking
      # hung.
      - name: verify the origin serves what was deployed
        env:
          SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          set -euo pipefail
          args=(--ssh-target deployci@selvage-protocol-prod)
          expected=$SERVER_VERSION
          if [[ $expected =~ ^(.+)-[0-9a-f]{7,40}$ ]]; then
            expected=${BASH_REMATCH[1]}
          fi
          if [[ $expected =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            args+=(--expect-version "$expected")
          fi
          scripts/verify_deploy.py "${args[@]}"
