# The public demo at `selvage-demo.dontblameme.dev`, and nothing else.
#
# Three containers on one origin, on an Azure `Standard_B2ats_v2`: 2 vCPU,
# 892 MiB of RAM and a 10 GiB swapfile. The front terminates TLS for the
# Cloudflare Origin CA certificate and routes; the server answers `/session` and
# `/meta`; the page answers everything else. `web_client`'s README owns the page.
#
# The box runs a copy of this directory at `/srv/selvage/`, which is
# self-contained: this file, `.env`, `proxy/` and `tls/`. The update timer beside
# this file pulls the tags `.env` names.
#
# Every service below is hardened the same way, and the readback of that is what
# the deployment is gated on: read-only root filesystem, every capability
# dropped, no process able to gain one, and a non-root user with no mount it
# does not need.
#
# The memory limits are the backstop, not a budget. Without them an
# over-committed server drags the host into swap or the kernel chooses a victim
# on it; with them the container dies inside its own cgroup and `restart:
# unless-stopped` brings it back in seconds, having dropped every room — visible
# and bounded. The arithmetic: 892 MiB total, about 120 MiB for the Docker
# daemon and containerd and about 350 MiB of stock Ubuntu and Tailscale, leaving
# roughly 420 for the three. 48 + 48 + 320 is 416.

name: selvage-prod

services:
  proxy:
    build:
      context: ./proxy
    # Built on the box from the files beside this one, never pulled: there is no
    # published image for this front and there should not be one, because its
    # configuration is the deployment's own.
    image: selvage-prod-proxy:local
    # Built only when the image is missing, so an `up -d` that changes nothing
    # else leaves the front and its WebSockets alone. A change to `proxy/` is
    # deployed with `docker compose up -d --build proxy`.
    # Started after the two upstreams so that their names resolve. The front
    # resolves `selvaged` and `selvage-web` once, at startup, and caches the
    # addresses, so `restart: true` matters as much as the ordering: recreating
    # an upstream can give it a new address, and a proxy left running would go on
    # dialling the old one. Compose restarts this service when it recreates
    # either of those.
    depends_on:
      selvaged:
        condition: service_started
        restart: true
      selvage-web:
        condition: service_started
        restart: true
    ports:
      # The only port any of the three publishes. It is 443 on the host because
      # Cloudflare connects to it; inside the container it is 8080, because
      # nginx runs as uid 101 with every capability dropped and a non-root
      # process cannot bind below 1024.
      #
      # Reachability is the network security group's job, not this file's: 443
      # is admitted from Cloudflare's published ranges and from nowhere else.
      # Nothing here listens on 80 — Cloudflare serves the redirect at its edge.
      - "443:8080"
    # The one mount in this deployment, and the only file the front reads from
    # outside its own image. Read-only, twice over: the front never writes a
    # certificate and cannot, and every directory it does need to write — the
    # pid file and the five temp paths — is already on the runtime's own tmpfs.
    # The target path is the one `proxy/conf.d/default.conf` names.
    #
    # The key is mode 640 owned by `root` and group 101 on the host, which is
    # the group uid 101 is in inside this image.
    volumes:
      - ./tls/origin.pem:/etc/selvage/tls/origin.pem:ro
      - ./tls/origin.key:/etc/selvage/tls/origin.key:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 48m
    restart: unless-stopped

  selvaged:
    image: ${SELVAGED_IMAGE:?set SELVAGED_IMAGE in .env}
    # The image's own command is the server alone, and the page is the `selvage-web`
    # container below; the limits here are the ones sized for this box. The short
    # form is that `--max-connections × --outbound-queue-bytes` is the server's own
    # outbound ceiling, and 32 × 8454144 is 258 MiB, the largest one this host can
    # be surprised by.
    #
    # 8454144 is the smallest queue `selvaged` accepts at all: the 8 MiB frame
    # bound plus the 64 KiB envelope headroom its own `smallest_queue_bytes`
    # counts. Below it the server exits 2 with the floor named, and the
    # container restart-loops; `deploy/test_compose_args.py` runs this
    # command line so that a value below the floor cannot be committed again.
    #
    # The grace period is the reference value on purpose: `/meta` advertises it
    # and both clients size their reconnect budget from it.
    command:
      - --listen
      - 0.0.0.0:8080
      - --room-grace-ms
      - "30000"
      - --max-connections
      - "32"
      - --max-rooms
      - "64"
      - --max-peers-per-room
      - "8"
      - --outbound-queue-bytes
      - "8454144"
      - --max-envelope-bytes
      - "5242880"
      - --inbound-bytes-per-sec
      - "1048576"
      - --inbound-burst-bytes
      - "33554432"
    # No `ports:`. The server is reachable from the two containers beside it and
    # from nothing else; every packet that reaches it came through the front.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 320m
    restart: unless-stopped

  selvage-web:
    image: ${SELVAGE_WEB_IMAGE:?set SELVAGE_WEB_IMAGE in .env}
    # No `ports:` here either. The page image already runs as uid 101 on 8080
    # with the base's own hardening (`web_client/compose.yaml`), so this service
    # is the same shape with the two things added that the one-origin deployment
    # needs: it is only reachable through the front, and it has a memory limit.
    #
    # An invite link is a page link — `/?room=…&token=…` — so a request line
    # carries the room token, which `PROTOCOL.md` §12 makes "a deployment MUST
    # NOT log request URLs" a MUST: the token is the room's whole permission.
    #
    # The page image has turned its own request log off — `web_client`'s
    # `packaging/nginx.conf` sets `access_log off` and keeps its error log at
    # `crit`, above every level at which nginx logs something request-scoped —
    # and the channel is closed here as well rather than filtered: the `none`
    # driver discards this container's output outright, so this is the
    # deployment's own guarantee rather than the image's, and a later image that
    # logs again still reaches no log this box keeps. This container's errors are
    # discarded too, which is small: it is a static file server whose failures
    # the front and the server beside it already show, and the front's own log is
    # silent by design for the same reason.
    logging:
      driver: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 48m
    restart: unless-stopped
