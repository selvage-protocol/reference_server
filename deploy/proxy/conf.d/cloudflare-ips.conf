# Cloudflare's published edge ranges, and the whole of the front's trust in the
# `CF-Connecting-IP` header: `real_ip` rewrites `$remote_addr` from that header
# only when the peer is one of these addresses, so a request that did not come
# through Cloudflare cannot name its own source and cannot escape the per-source
# caps in `nginx.conf`.
#
# The Azure network security group on this box admits 443 from the same list and
# from nowhere else, so these two are the same fact written twice — once where
# the packet is refused and once where the source is read. Refresh both together
# from `https://api.cloudflare.com/client/v4/ips`; the ranges change rarely and
# Cloudflare announces a change before it takes effect.
#
# `set_real_ip_from` is an http-level directive, which is why this file is a
# sibling of `default.conf` rather than part of it: the server block beside it
# is included in the same alphabetical pass and only needs the zones.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
