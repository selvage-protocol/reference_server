[package]
name = "selvaged"
description = "Memory-only reference server for the Selvage Session Protocol"
version.workspace = true
edition.workspace = true
# Source-available, not open source: see LICENSE. `license-file` rather than an SPDX
# `license` because this crate is the one that does not share the workspace's.
license-file = "LICENSE"
publish = false
repository.workspace = true

[[bin]]
name = "selvaged"
path = "src/main.rs"

[dependencies]
selvage-protocol.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rand = "0.10"
serde_json.workspace = true

[lints]
workspace = true
