[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

ignore = []

[bans]
multiple-versions = "warn"
highlight = "all"

deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.95

allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
  "OpenSSL",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

unused-allowed-license = "warn"

[[licenses.clarify]]
name = "ring"
expression = "MIT OR ISC OR OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]

allow-git = []
