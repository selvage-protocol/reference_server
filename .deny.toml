[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# The default scope, not a narrowed one. `unmaintained` was `workspace` — only a crate that is a
# direct dependency of a workspace member — which is what kept the unmaintained `smallstr` behind
# `yrs` out of the report instead of in it. Anything the graph knowingly carries is listed under
# `ignore` with a reason, so silence here is a decision somebody wrote down rather than a scope
# that happened to hide the advisory.
unmaintained = "all"
# Left at cargo-deny's default; it reports a direct dependency of a workspace member.
unsound = "workspace"

ignore = [
  # `yrs` depends on `smallstr`, which is unmaintained and has no fixed release: RUSTSEC-2026-0215
  # affects every version. There is no upgrade that clears it, so it is carried deliberately
  # rather than scoped out of the check. Revisit when `yrs` drops the dependency — an entry that
  # nothing matches warns (`unused-ignored-advisory`).
  { id = "RUSTSEC-2026-0215", reason = "unmaintained transitive dependency of yrs; every version is affected and no patched release exists" },
]

[bans]
multiple-versions = "warn"
highlight = "all"

deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.95

allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
  "OpenSSL",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # The server crate (`crates/selvaged`) alone: source-available with a non-compete that
  # converts to MIT two years after each release. Everything else here is MIT OR Apache-2.0.
  "FSL-1.1-MIT",
]

unused-allowed-license = "warn"

[[licenses.clarify]]
name = "ring"
expression = "MIT OR ISC OR OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]

allow-git = []
