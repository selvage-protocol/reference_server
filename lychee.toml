# `exclude` is the addresses lychee cannot read as live links from here. The ones
# that belong to a deployment say what they answer where that deployment runs;
# none of them is a broken link.
#
# `root_dir` is what lets a root-relative link be checked at all: without one,
# lychee refuses to resolve `/...` out of a file on disk rather than trying. The
# terms page's way back to the demo is exactly that link — same-origin by
# design, so it must not name the origin — and against this checkout it resolves
# to a path that is here. That the link works when the front serves the page is
# `packaging/prod/check-terms.sh`'s assertion, which fetches it.
root_dir = "."
exclude = [
  # The contact address `packaging/prod/proxy/www/terms.html` hands a reader. It
  # is a `mailto:`, and lychee runs here without `--include-mail`, which reads an
  # address's shape and cannot follow it to anything live. Naming the scheme says
  # that on purpose rather than leaving it to that default, and the address stays
  # a link a person can write to.
  "^mailto:",
  "https://fsf.org/",
  # The public demo's front proxying to its sibling containers by their Compose
  # service names (`packaging/prod/`). Those names resolve only inside that
  # deployment's own network.
  "http://selvaged:8080",
  "http://selvage-web:8080",
  # Loopback is an address on whichever machine is running the proof — the image
  # smoke's own server on 18080 (`scripts/image-smoke.sh`), the front's limits
  # harness, and the deploy workflow's `https://127.0.0.1/meta` read on the public
  # demo's box. It answers only while that is running, and it is never a link
  # anything can check from a checkout.
  "^https?://127\\.0\\.0\\.1[:/]",
  # `h` is the placeholder host a client test builds its links from
  # (`ws://h:8080/session?room=r-1`), read back as the page form over the scheme a
  # browser speaks. No such host exists to answer, and `ws://` is already
  # unsupported rather than checked.
  "^https?://h[:/]",
  # The Pi demo's **server** origin, where 404 is the right answer: that
  # deployment is two-origin, so its page is `http://100.64.0.3/` (200) and only
  # `/meta` and `/session` exist on `:8080`. The URL is in
  # `packaging/pi-demo/tls-proxy.py`'s docstring as the destination that proxy
  # relays to, which is the documented shape of that deployment; a check reading
  # it as a broken link would be a check disagreeing with the design.
  "http://100.64.0.3:8080/",
]
