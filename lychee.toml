# `exclude` is the addresses lychee cannot read as live links from here. Loopback and test
# placeholders answer only on a machine running a proof, so none of them is a broken link.
#
# The gate over the reader-facing front matter, `scripts/ci-local.sh links` and the
# `links` step of the workflow's `checks` job, runs this over `README.md` and
# `docs/` and nothing else: that pair is this repository's own prose, not every
# Markdown file a checkout might hold. The pre-commit `lychee` hook is handed every
# staged text file instead and reads this same configuration, which is why the
# entries below stay even though the gate's two directories carry none of them.
#
# `root_dir` is what lets a root-relative link be checked at all: without one, lychee
# refuses to resolve `/...` out of a file on disk rather than trying.
root_dir = "."
exclude = [
  "https://fsf.org/",
  # The runner expands this workflow template before fetching the release asset.
  '^[h]ttps://github[.]com/lycheeverse/lychee/releases/download/lychee-v[$]([{]|%7[Bb])LYCHEE_VERSION',
  # Loopback is an address on whichever machine is running the proof — the image
  # smoke's own server on 18080 (`scripts/image-smoke.sh`) — and it is never a link
  # anything can check from a checkout.
  "^https?://127\\.0\\.0\\.1[:/]",
  # `h` is the placeholder host a client test builds its links from
  # (`ws://h:8080/session?room=r-1`), read back as the page form over the scheme a
  # browser speaks. No such host exists to answer, and `ws://` is already
  # unsupported rather than checked.
  "^https?://h[:/]",
  # The hook is handed every staged text file, and scripts carry loopback addresses
  # with a port the script was given, which has nothing for lychee to fetch in a `$port`.
  "^wss?://127\\.0\\.0\\.1[:/]",
]
# `vectors/` is vendored test data, not this repository's prose: the specification
# authors it, and the hook is handed every staged text file, so a vector's prose may
# carry a link written as an example. The gate still reads `README.md` and `docs/`,
# which is the front matter this repository maintains by hand.
exclude_path = ["^vectors/"]
