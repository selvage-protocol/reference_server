[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/client",
    "crates/selvaged",
    "crates/harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/selvage-protocol/selvage"

[workspace.dependencies]
selvage-protocol = { path = "crates/protocol" }
selvage-client = { path = "crates/client" }
selvaged = { path = "crates/selvaged" }
selvage-harness = { path = "crates/harness" }

futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30"
yrs = { version = "0.27", features = ["sync"] }

[profile.test]
opt-level = 1
