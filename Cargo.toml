[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/client",
    "crates/selvaged",
    "crates/harness",
]

[workspace.metadata.crane]
name = "selvaged"

[workspace.package]
version = "0.4.6"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/selvage-protocol/reference_server"

[workspace.lints.rust]
unsafe_code      = "deny"
unused_imports   = "deny"
unused_variables = "deny"
unused_mut       = "deny"
dead_code        = "deny"

[workspace.lints.clippy]
pedantic                      = "deny"
unwrap_used                   = "deny"
expect_used                   = "deny"
panic                         = "deny"
shadow_reuse                  = "deny"
todo                          = "deny"
unimplemented                 = "deny"
dbg_macro                     = "deny"
undocumented_unsafe_blocks    = "deny"
indexing_slicing              = "deny"
cast_possible_truncation      = "deny"
cast_sign_loss                = "deny"
cast_possible_wrap            = "deny"
cast_precision_loss           = "deny"
arithmetic_side_effects       = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_imports              = "deny"
enum_glob_use                 = "deny"
unused_result_ok              = "deny"
absolute_paths                = "deny"
allow_attributes              = "deny"
missing_panics_doc            = "deny"
unsafe_derive_deserialize     = "deny"
cast_ptr_alignment            = "deny"
result_unit_err               = "deny"
or_fun_call                   = "deny"
expect_fun_call               = "deny"
cast_lossless                 = "deny"
vec_resize_to_zero            = "deny"
clone_on_ref_ptr              = "deny"
rc_buffer                     = "deny"
arc_with_non_send_sync        = "deny"
wildcard_enum_match_arm       = "deny"
match_same_arms               = "deny"
single_match_else             = "deny"
missing_const_for_fn          = "deny"
redundant_pub_crate           = "deny"
option_if_let_else            = "deny"
needless_pass_by_ref_mut      = "deny"
integer_division              = "deny"
use_self                      = "deny"
redundant_clone               = "deny"

[workspace.dependencies]
selvage-protocol = { path = "crates/protocol" }
selvage-client = { path = "crates/client" }
selvaged = { path = "crates/selvaged" }
selvage-harness = { path = "crates/harness" }

futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-tungstenite = "0.30"
yrs = { version = "0.27", features = ["sync"] }

# `selvage/2`'s sealed frame (`CANONICAL.md` §6.1): AES-256-GCM, HKDF-SHA256 and Ed25519.
aes-gcm = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
hkdf = "0.12"
sha2 = "0.10"

[profile.test]
opt-level = 1
