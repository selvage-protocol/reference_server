<html lang="en">

    <meta charset="utf-8" />

    <title>Selvage demo: page not found</title>
    <meta name="robots" content="noindex" />
    <!--
      One file, styling and mark included, like `terms.html`: a missing page is
      the one time nothing else can be assumed to arrive. The card is the demo's
      own start card (width, radius, mark, heading, primary button), so a wrong
      address still looks like the place it was meant to reach.
    -->
    <style>

        color-scheme: dark;
        --background: #1e1e2e;
        --foreground: #cdd6f4;
        --card: #181825;
        --crust: #11111b;
        --muted-foreground: #a6adc8;
        --border: #313244;
        --primary: #cba6f7;
        --primary-hover: #d5b4fa;
        --primary-foreground: #1e1e2e;
        --radius: 0.5rem;
        --shadow: 0 18px 44px -20px rgba(0, 0, 0, 0.8);
      }
      html {
        min-height: 100%;
        font: 14px/1.5 "Liberation Sans", "DejaVu Sans", system-ui, sans-serif;
        background:
          radial-gradient(60rem 40rem at 50% 38%, rgba(203, 166, 247, 0.08), transparent 70%),
          var(--crust);
      }

        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        color: var(--foreground);
      }
      main {
        box-sizing: border-box;
        width: min(24rem, 100%);
        padding: 1.9rem 1.9rem 1.7rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);

    <main>
      <span class="mark" aria-hidden="true"></span>
      <h1>404 Not found</h1>
      <p>This link is mistyped or out of date. Head back to start or join a session.</p>
      <a class="button" href="/">Back to the demo</a>
    </main>
    <footer>Selvage demo · <a href="/terms">Terms of use</a></footer>
