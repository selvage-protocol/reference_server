# The front's nginx, replacing the base image's `/etc/nginx/nginx.conf`
# wholesale. Everything this file decides is http-level or process-level; where
# a request goes and what it is allowed is `conf.d/default.conf`.
#
# It runs as uid 101 with every capability dropped and a read-only root
# filesystem, so the pid file and the five temp paths are the only writes and
# all six are declared onto `/dev/shm`, the tmpfs the container runtime mounts
# itself. There is no `user` directive: the master is already the unprivileged
# user, and one would ask it to setuid without the capability to do it.

# One worker, not `auto`. The box this runs on has two vCPUs shared with the
# server and the page, and the front's work per connection is a TLS handshake
# and a byte pump; a second worker costs memory on a host with 892 MiB and no
# swap and buys nothing at demo traffic.
worker_processes 1;
pid /dev/shm/nginx.pid;

# No request URL reaches either log. The access log is off (below), and this
# one is at `crit`. That matters because nginx appends the request line to every
# error it logs while a request is in flight — a throttled handshake, an
# upstream that is restarting — and the request line of `/session` and of the
# page both carry the room token in the query string, which `PROTOCOL.md` §12
# makes a MUST: "a deployment MUST NOT log request URLs".
#
# `crit` is above every level at which nginx logs something request-scoped. The
# two this deployment can actually produce are both `error`: `limit_req` and
# `limit_conn` refusals, and a failed connect to an upstream that is being
# recreated. What is kept is every process-level fault — a worker that died, a
# resource exhausted, a port that could not be bound — and none of those carries
# a request. `error_log` takes a file or `stderr` and no filter, so the level is
# the only control there is; the residual is a `crit`-level message emitted
# while a request is in flight, which is named in `README.md` rather than
# assumed away.
error_log /dev/stderr crit;

events {
    # Per worker, and counting both the client and the upstream half of each
    # proxied request. 256 client connections is a ceiling this box would not
    # enjoy reaching; `selvaged` refuses past its own `--max-connections` well
    # before this, and `conf.d/default.conf` caps what one source may hold.
    worker_connections 512;
}

http {
    # The log that would have recorded every URL, including the query string
    # that carries the token. Disabled rather than filtered: there is nothing in
    # a request line this deployment is allowed to keep.
    access_log off;

    # nginx creates each of its five temp directories at startup and treats a
    # failure as fatal, so none of them is left to the base image's compiled
    # default: every one is declared onto the runtime's own tmpfs, which is the
    # only writable path this container has.
    client_body_temp_path /dev/shm/client_temp;
    proxy_temp_path       /dev/shm/proxy_temp;
    fastcgi_temp_path     /dev/shm/fastcgi_temp;
    uwsgi_temp_path       /dev/shm/uwsgi_temp;
    scgi_temp_path        /dev/shm/scgi_temp;

    # Counting and pricing are per source, and behind Cloudflare the source is
    # not the peer on the wire: every connection arrives from a Cloudflare edge.
    # `conf.d/cloudflare-ips.conf` names Cloudflare's published ranges, and the
    # real_ip module trusts `CF-Connecting-IP` only from those addresses, so
    # these keys are the end client's address and a request that did not come
    # through Cloudflare cannot choose its own.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # What one source may hold at once, and how fast it may open the two
    # endpoints that cost the server something. The server has no per-source
    # view at all — these are the numbers only a front can keep, and the
    # server's own caps (`--max-connections`, `--max-rooms`,
    # `--inbound-bytes-per-sec`) bound what is left.
    limit_conn_zone $binary_remote_addr zone=perip:1m;
    limit_conn_zone $binary_remote_addr zone=persocket:1m;
    limit_req_zone  $binary_remote_addr zone=handshake:1m rate=5r/s;

    # A 429 rather than a 503: what the source did is open too much too fast,
    # and that is a status a client may retry.
    limit_conn_status 429;
    limit_req_status  429;

    # The upgrade header is `upgrade` on a WebSocket dial and absent on
    # everything else, and a `Connection` that says `upgrade` on an ordinary
    # request is a lie to the upstream. Derived rather than hardcoded.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    send_timeout 60s;
    keepalive_timeout 65s;

    include /etc/nginx/conf.d/*.conf;
}
