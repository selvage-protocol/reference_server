# The front's one server block: TLS, then two destinations.
#
# Cloudflare terminates the visitor's TLS and speaks TLS again to this listener
# under Full (strict), so the certificate is the Cloudflare Origin CA pair
# covering `selvage-demo.dontblameme.dev` — the only thing this container
# reads from outside its own image, and the mount named in `../compose.yaml`.
# Port 80 is not listened on: Cloudflare's redirect is served at Cloudflare's
# edge, and the origin's network security group denies 80 outright.
#
# The split is the owner's, decided 2026-09-21: `/session` and `/meta` are the
# server's two endpoints and belong to `selvaged`; everything else, the page
# included, is `selvage-web`'s. The page and the socket then share an origin, so
# the page's advisory `/meta` read is same-origin and a guest link needs no CORS
# or `?server=`.

server {
    listen 8080 ssl;
    # One name, the demo's own: `selvage.dontblameme.dev` is the project's
    # landing page, so a request arriving here with that Host is not the demo.
    server_name selvage-demo.dontblameme.dev;

    ssl_certificate     /etc/selvage/tls/origin.pem;
    ssl_certificate_key /etc/selvage/tls/origin.key;

    # Origin CA certificates are not in any browser's trust store and never need
    # to be: only Cloudflare talks to this listener. TLS 1.0 and 1.1 are off
    # because the peer is Cloudflare and Cloudflare speaks 1.2 and 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;

    # No `Strict-Transport-Security` here, and that is the decision rather than
    # an omission: the field a visitor receives is Cloudflare's, set for the
    # whole zone, and a second one from this server would be a duplicate field.
    # `README.md` has the evidence and `test_front_limits.py` fails if one is
    # added.
    server_tokens off;

    # The front's own log decision lives in `../nginx.conf`; it is repeated in
    # the server block for the same reason it exists at all — a location that
    # adds an `access_log` would be a location that disagrees.
    access_log off;

    # Per source, keyed on the client address `real_ip` recovered rather than on
    # the Cloudflare edge every request arrives from. The default is the page's:
    # generous, because a page load is a burst of small reads and an asset
    # refused here is a page that does not render. The two endpoints that cost
    # the server something get their own, tighter zones below.
    limit_conn perip 32;

    # `/session` is the WebSocket endpoint, and the whole of what a source may
    # hold there is the front's contribution to `PROTOCOL.md` §12's "connection
    # cap, an idle deadline and a rate limit". The server bounds the total it
    # will seat (`--max-connections`) but cannot see who is asking; this can.
    #
    # The upgrade is passed through as it arrives: `proxy_http_version 1.1` and
    # the two upgrade headers are what turn nginx into a byte pump, and without
    # them the 101 never reaches the client and the session dies at the
    # handshake.
    location = /session {
        limit_conn persession 8;
        limit_req  zone=handshake burst=10 nodelay;

        proxy_pass http://selvaged:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # A server that is not there should say so in seconds. Docker removes a
        # stopped container's address from the network, so a connect to it is
        # dropped rather than refused, and nginx's default 60-second connect
        # timeout would hold the visitor's socket open saying nothing.
        proxy_connect_timeout 5s;

        # Above the server's ping, with room. `selvaged` sends a ping every 30 s
        # and a live socket is therefore never quiet for a minute, so this only
        # ever fires on a connection that is genuinely gone. Cloudflare's own
        # 100-second idle close is above the ping too; nothing here lengthens
        # either.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # `/meta` is one small JSON read. It is a plain request, so it needs no
    # upgrade, and a source has little reason to want more than a few of them
    # open at once.
    #
    # Its own request zone, not `/session`'s. The page reads `/meta` on every
    # load and opens `/session` on the click that follows, so one zone for the
    # two means a visitor refreshing the page spends the allowance the
    # handshake needs and is refused `429` at the join — measured on the live
    # instance.
    location = /meta {
        limit_conn permeta 4;
        limit_req  zone=metaread burst=10 nodelay;

        proxy_pass http://selvaged:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # The terms of this instance, which are the instance's own and not the
    # software's: the licences are unchanged, and what the page states is how
    # *this* running server may be used. Served from a file in this image rather
    # than from a string in this config, because it is prose that a person writes
    # and a reviewer reads, and an nginx directive is a place to keep neither.
    #
    # `default_type` and `charset` are set here because `nginx.conf` replaces the
    # base image's wholesale and includes no `mime.types`, so a file served from
    # disk would otherwise arrive as `text/plain` and render as source.
    #
    # One location for both spellings of the path: whether a link or a typed URL
    # works should not depend on a trailing slash. The regex is anchored, so
    # `/termsomething` is not this page.
    location ~ ^/terms/?$ {
        root /usr/share/selvage/www;
        try_files /terms.html =404;
        default_type text/html;
        charset utf-8;
    }

    # The page, and everything that is not one of the three paths above.
    # The page container answers its own 404s and its own media types; this front
    # changes one thing about the response and adds nothing else to it.
    location / {
        proxy_pass http://selvage-web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # The non-commercial gate, on the page a visitor is actually looking at.
        # It is injected here rather than written into the page because the page
        # is built in `web_client` and shipped as a bundle this deployment must
        # not edit; a notice about *this instance* is the instance's own, and
        # this front is where the instance's configuration lives.
        #
        # `Accept-Encoding` is cleared upstream so the page arrives uncompressed
        # and the substitution always applies — Cloudflare compresses towards the
        # visitor, so nothing is lost — and a `</body>` this page does not have
        # would be a notice that silently disappears, which is why the isolated
        # proof in `README.md` reads the banner out of the served bytes rather
        # than out of this file.
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<aside style="box-sizing:border-box;padding:.65rem 1rem;font:14px/1.45 system-ui,sans-serif;text-align:center;color:#a6adc8;background:#181825;border-top:1px solid #313244">Demo instance: <strong style="color:#f9e2af">non-commercial use only.</strong> Not a hosted product; rooms are not persisted and may be reset at any time. <a style="color:#cba6f7" href="/terms">Terms of use</a></aside></body>';
    }
}
