# Self-host for someone evaluating selvage on their own machine: two containers
# on loopback — the server, and the page image relaying to it. The public demo's
# shape is in `deploy/`.
#
# No volumes: the server is memory-only and the page is served from the page
# image, so there is nothing to persist and nothing to mount.
#
# The run is hardened: read-only root filesystem, every capability dropped, no
# process able to gain one, and no host socket mounted.
services:
  selvaged:
    build: .
    image: ghcr.io/selvage-protocol/selvaged:latest
    # No `ports:`. The page container beside it reaches the server on this
    # project's own network and nothing else does. Publish a port here only to
    # let a client dial `/session` and `/meta` directly, without the page.
    #
    # Inside the container the wildcard is correct: the network supplies the
    # boundary. The image's own command is `--listen 0.0.0.0:8080`; override per
    # host, e.g. `--listen 0.0.0.0:9000`.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  selvage-web:
    image: ghcr.io/selvage-protocol/selvage-web:latest
    ports:
      # Loopback by default: a stranger evaluating locally reaches it, and
      # nothing else does. To serve other machines, rebind deliberately, e.g.
      # "8080:8080".
      - "127.0.0.1:8080:8080"
    environment:
      # The server's address on this network, as `host:port` or an `http://`
      # base: the page relays the session and `/meta` to it, so one origin still
      # serves the page and the room. The variable's name is `web_client`'s to
      # settle; rename this line alone if its image publishes a different one.
      SELVAGE_SERVER: selvaged:8080
    depends_on:
      - selvaged
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
