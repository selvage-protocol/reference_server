# Self-host for someone evaluating selvage on their own machine. The other
# deployment shapes are in packaging/README.md; the Pi's two are under
# packaging/pi/ (what runs there now) and packaging/pi-demo/ (the native shape it
# replaced).
#
# No volumes: the image carries the browser page it serves, and the server is
# memory-only, so there is nothing to persist and nothing to mount. The `./page`
# override at the bottom is the one mount here, and it is commented out.
#
# The run is hardened: read-only root filesystem, every capability dropped, no
# process able to gain one, and no host socket mounted.
services:
  selvaged:
    build: .
    image: ghcr.io/selvage-protocol/selvaged:0.4.2
    ports:
      # Loopback by default: a stranger evaluating locally reaches it, and
      # nothing else does. To serve other machines, rebind deliberately, e.g.
      # "8080:8080".
      - "127.0.0.1:8080:8080"
    # Inside the container the wildcard is correct: the port mapping supplies
    # the boundary. The image's own command is
    # `--listen 0.0.0.0:8080 --serve-page /page`; override per host, e.g.
    # `--listen 0.0.0.0:9000` with a matching ports entry.
    #
    # One container, one port: the page, /session and /meta share an origin, so
    # the guest link is a page link (`/` with the room and token in the query)
    # and nothing needs a CORS proxy. The server needs no database and no TLS
    # proxy beyond the operator's own edge.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    #
    # Override: serve a page built from another `web_client` revision (or one
    # you are working on) by mounting it over the baked copy — the image's own
    # command already points `--serve-page` at /page, so the mount is the whole
    # override. Compose has no conditional mount, so an uncommented `./page`
    # that does not exist replaces the baked page with an empty directory:
    # uncomment it only when the directory is there.
    # volumes:
    #   - ./page:/page:ro
